[project]
name = "telecom-noc-copilot-agent"
version = "0.1.0"
description = "Diagnostic tool layer for the Telecom NOC Copilot agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "..", "../backend", "../mock-services"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "tests"]
