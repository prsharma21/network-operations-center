name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "agent/**"
      - "mcp-server/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "agent/**"
      - "mcp-server/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  python-checks:
    name: Python checks and pytest
    runs-on: ubuntu-latest

    steps:
