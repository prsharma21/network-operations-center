[project]
name = "telecom-noc-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for the Telecom NOC Copilot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "../mock-services"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "oss_api"]
