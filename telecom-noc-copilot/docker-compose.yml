# Local development services. Do not put real secrets in this file.
# Copy .env.example to .env and set POSTGRES_PASSWORD before starting Postgres.
#
# Start the local database:
#   docker compose up -d postgres
# Inspect:
#   docker compose ps
#   docker logs telecom-noc-postgres
# Stop without deleting data:
#   docker compose stop postgres
# Do not use `docker compose down -v` as routine cleanup — that deletes the
# named volume and all persisted rows.

services:
  postgres:
    image: postgres:16-alpine
    container_name: telecom-noc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telecom_noc}
      POSTGRES_USER: ${POSTGRES_USER:-noc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - telecom_noc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # depends_on / ports / env to be configured later
    profiles: ["app"]

  frontend:
    build:
      context: ./frontend
    # depends_on / ports / env to be configured later
    profiles: ["app"]

  mcp-server:
    build:
      context: ./mcp-server
    profiles: ["app"]

  oss-api:
    build:
      context: ./mock-services/oss_api
    profiles: ["mocks"]

  telemetry-api:
    build:
      context: ./mock-services/telemetry_api
    profiles: ["mocks"]

  deployment-api:
    build:
      context: ./mock-services/deployment_api
    profiles: ["mocks"]

  ticketing-api:
    build:
      context: ./mock-services/ticketing_api
    profiles: ["mocks"]

volumes:
  telecom_noc_postgres_data:
